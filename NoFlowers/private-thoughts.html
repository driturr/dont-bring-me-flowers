<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Thoughts</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/drama.js" defer></script>
</head>
<body class="private-page">
  <main class="unlock-panel">
    <p class="eyebrow">Private draft</p>
    <h1>Do not publish this one</h1>

    <label for="passwordInput">Enter the password...</label>
    <div class="password-row">
      <input id="passwordInput" type="password" autocomplete="off" placeholder="password">
      <button type="button" onclick="unlockJournal()">Unlock</button>
    </div>
    <p id="unlockMessage" class="message" aria-live="polite"></p>

    <section id="journalEntry" class="journal locked" aria-label="Locked journal entry">
        <div id="journal"></div>
    </section>
  </main>
</body>
</html>
